
name: Y654 AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the AI Agent"
        required: true
        type: string

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Gemini Agent
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are the senior developer of Y654 Project.

            Task:
            ${{ inputs.task }}

            Inspect the repository.
            Understand existing architecture.
            Make only necessary changes.
            Preserve existing working files.
            Run safe tests where possible.
            Report all changes and test results.

      - name: Commit Changes
        run: |
          git config user.name "Y654 AI Agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "AI Agent updates"
          git push
          
